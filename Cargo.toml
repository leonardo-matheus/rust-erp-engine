[package]
name = "erp_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
chrono = { version = "0.4", features = ["wasmbind"] }
uuid = { version = "1", features = ["v4", "js"] }

[dependencies.web-sys]
version = "0.3"
features = ["console", "Storage", "Window"]
